[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-registry"
version = "0.1.0"
description = "A lightweight Python registry for discoverable, validated, runnable tasks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gonçalo Alves" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/gla02/task-registry"
Repository = "https://github.com/gla02/task-registry"
Issues = "https://github.com/gla02/task-registry/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
